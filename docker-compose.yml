services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: extractor_api
    env_file:
      - .env
    environment:
      ENVIRONMENT: docker
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/extractor
      ARQ_REDIS_URL: redis://redis:6379
      STORAGE_LOCAL_DIR: /app/uploads
      LLM_EXTRACTION_MODEL: ${LLM_EXTRACTION_MODEL:-gemini/gemini-2.5-flash}
      LLM_CLASSIFIER_MODEL: ${LLM_CLASSIFIER_MODEL:-gemini/gemini-2.5-flash}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    command: >
      sh -c "alembic upgrade head &&
      fastapi run app/main.py --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health', timeout=5).read()",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: extractor_worker
    env_file:
      - .env
    environment:
      ENVIRONMENT: docker
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/extractor
      ARQ_REDIS_URL: redis://redis:6379
      STORAGE_LOCAL_DIR: /app/uploads
      LLM_EXTRACTION_MODEL: ${LLM_EXTRACTION_MODEL:-gemini/gemini-2.5-flash}
      LLM_CLASSIFIER_MODEL: ${LLM_CLASSIFIER_MODEL:-gemini/gemini-2.5-flash}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    command: arq app.workers.worker.WorkerSettings
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      api:
        condition: service_healthy

  db:
    image: postgres:15-alpine
    container_name: extractor_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: extractor
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d extractor"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: extractor_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  postgres_data:
  redis_data:
  uploads_data:
